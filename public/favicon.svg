<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Background for High Tab Visibility -->
  <rect width="64" height="64" rx="14" fill="#0D0D0D"/>
  
  <!-- Outer Precision Scope Ring -->
  <circle cx="32" cy="32" r="24" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.95"/>
  
  <!-- Global Latitudinal Curve -->
  <ellipse cx="32" cy="32" rx="24" ry="10" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7"/>
  
  <!-- Global Longitudinal Curve -->
  <ellipse cx="32" cy="32" rx="10" ry="24" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7"/>
  
  <!-- Precision Scope Reticle Crosshairs (Crimson Red + Gold Accent) -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#B80000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="60" stroke="#B80000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="14" y2="32" stroke="#B80000" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="60" y2="32" stroke="#B80000" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Central Aperture Focal Point (Gold Crown Core) -->
  <circle cx="32" cy="32" r="4.5" fill="#FFD200"/>
  <circle cx="32" cy="32" r="2" fill="#B80000"/>
</svg>
